<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GB Settlement results</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#f4f6f8;color:#0f172a}
header{background:#1f3a5f;color:#fff;padding:16px;border-radius:8px}
img{width:100%;height:auto;border:1px solid #d6dee8;border-radius:8px;background:#fff}
.ok{background:#dcfce7;color:#14532d;padding:10px;border-radius:8px}
a{color:#1f3a5f}
</style></head>
<body>
<header><h1>GB Settlement &amp; Imbalance results</h1>
<p>Independent portfolio using public Elexon data. Not affiliated with Elexon.</p></header>
<p class="ok">This page loaded. Scroll for the insight note, 8 slides and charts.</p>
<div id="c">Loading images…</div>
<script>
const base = "https://cdn.jsdelivr.net/gh/Liyrs58/gb-settlement-monitor@main/";
const n = 17;
const files = Array.from({length:n}, (_,i) => "p"+i+".html");
Promise.all(files.map(f => fetch(base + f).then(r => {
  if (!r.ok) throw new Error(f + " " + r.status);
  return r.text();
}))).then(t => { document.getElementById("c").innerHTML = t.join(""); })
.catch(e => {
  // fallback to raw.githubusercontent
  const base2 = "https://raw.githubusercontent.com/Liyrs58/gb-settlement-monitor/main/";
  return Promise.all(files.map(f => fetch(base2 + f).then(r => r.text())))
    .then(t => { document.getElementById("c").innerHTML = t.join(""); })
    .catch(e2 => { document.getElementById("c").textContent = "Failed: " + e + " / " + e2; });
});
</script>
</body></html>
